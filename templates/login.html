{% load static %}
<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Geosginal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="{% static 'css/base.css' %}"></head>
<body class="login-page">
<div class="login-wrapper">
<div class="login-card">
<div class="login-header"><h1>Geosginal</h1><p>Network Coverage Intelligence</p></div>
<form method="post" class="login-form">{% csrf_token %}
{% if form.non_field_errors %}<div class="alert-error">{{ form.non_field_errors.0 }}</div>{% endif %}
<div class="form-group"><label><i class="fas fa-user"></i> Username</label>{{ form.username }}</div>
<div class="form-group"><label><i class="fas fa-lock"></i> Password</label>{{ form.password }}</div>
<button type="submit" class="btn btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> Sign In</button>
</form>
</div></div></body></html>
